name: Deploy NishioHub to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nishiohub-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Rails API and React UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure SSH
      - name: Configure SSH
        env:
            SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
            SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519

            printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts

            echo "SSH configuration completed."

      - name: Test SSH Connection
        env:
            SERVER_HOST: ${{ secrets.SERVER_HOST }}
            SERVER_USER: ${{ secrets.SERVER_USER }}
            SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
            ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${SERVER_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'SSH connection successful!'"
            
      # 3. Deploy to production server
      - name: Deploy NishioHub
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${SERVER_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" << 'EOF'

            set -e

            echo "Starting NishioHub deployment..."

            cd /var/www/nishioHub

            # Pull latest code
            git fetch origin main
            git pull --ff-only origin main

            # Build updated Docker images
            docker compose build

            # Start PostgreSQL first
            docker compose up -d --wait db

            # Run Rails database migrations
            docker compose run --rm api \
              bin/rails db:migrate

            # Start updated services
            docker compose up -d --wait --remove-orphans

            # Remove unused Docker images
            docker image prune -f

            echo "NishioHub deployment completed!"

          EOF

      # 4. Verify deployment
      - name: Verify Production Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${SERVER_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /var/www/nishioHub && docker compose ps"