name: Test and deploy NishioHub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nishiohub-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n ops/deploy.sh ops/renew-certificates.sh ops/prepare-known-hosts.sh nishioHub-api/bin/docker-entrypoint
      - run: python3 -m unittest discover -s ops/tests -v
      - run: docker compose --env-file ops/production.env.example config --quiet
      - run: docker compose --env-file ops/production.env.example build api ui
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nishioHub-ui/package-lock.json
      - run: npm ci
        working-directory: nishioHub-ui
      - run: npm run typecheck && npm run lint && npm run build
        working-directory: nishioHub-ui
  api:
    # Ruby 3.3.6 is available on this image; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nishiohub
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nishiohub_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://nishiohub:test_password@127.0.0.1:5432/nishiohub_test
      SECRET_KEY: ci_test_key_only
      EMAIL_TOKEN_SECRET: ci_test_email_key_only
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
          working-directory: nishioHub-api
      - run: bin/rails db:migrate && bin/rails test
        working-directory: nishioHub-api
  deploy:
    needs: [ui, api, deployment-config]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the tested commit over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/nishioHub' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          [[ "$SERVER_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "${SERVER_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          : "${SSH_PRIVATE_KEY:?Missing SERVER_SSH_KEY}"
          : "${SERVER_KNOWN_HOSTS:?Missing SERVER_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo '::error::SERVER_SSH_KEY must be a complete, valid private deployment key without a passphrase. A public key, server host key, or fingerprint will not work. Update the production environment secret.'
            exit 1
          fi
          printf '%s\n' "$SERVER_KNOWN_HOSTS" | bash ops/prepare-known-hosts.sh "$SERVER_HOST" "${SERVER_PORT:-22}" "$HOME/.ssh/known_hosts"
          ssh_args=(-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "${SERVER_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30)
          remote="$SERVER_USER@$SERVER_HOST"
          if ! ssh "${ssh_args[@]}" "$remote" true; then
            echo '::error::SSH login failed. Verify SERVER_USER and install the public key matching SERVER_SSH_KEY in that account authorized_keys. Check SSH-directory ownership/permissions and server sshd logs. See ops/README.md.'
            exit 1
          fi
          if ! ssh "${ssh_args[@]}" "$remote" "test -w '$DEPLOY_PATH' && mkdir -p '$DEPLOY_PATH/releases/$RELEASE_SHA'"; then
            echo '::error::The SSH account cannot write DEPLOY_PATH or its releases directory. An administrator must grant the deployment account ownership of those directories. Do not recursively change database or certificate ownership. See ops/README.md.'
            exit 1
          fi
          git archive "$RELEASE_SHA" | ssh "${ssh_args[@]}" "$remote" "tar -x -C '$DEPLOY_PATH/releases/$RELEASE_SHA'"
          ssh "${ssh_args[@]}" "$remote" "bash '$DEPLOY_PATH/releases/$RELEASE_SHA/ops/deploy.sh' '$DEPLOY_PATH' '$RELEASE_SHA'"
