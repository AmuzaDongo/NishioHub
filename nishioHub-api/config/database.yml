default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "nishiohub") %>
  password: <%= ENV.fetch("DB_PASSWORD", "nishiohub123").to_json %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "nishiohub_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "nishiohub_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "nishiohub_production") %>
  url: <%= ENV["DATABASE_URL"] %>
