name: nishiohub
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nishiohub_production
      POSTGRES_USER: nishiohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nishiohub -d nishiohub_production']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: nishiohub-api:${RELEASE_SHA:-local}
    build: ./nishioHub-api
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: 'true'
      RAILS_SERVE_STATIC_FILES: 'true'
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?Set RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET:?Set EMAIL_TOKEN_SECRET}
      DB_HOST: db
      DB_USER: nishiohub
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: nishiohub_production
      FORCE_SSL: 'true'
      FRONTEND_URL: https://nishiohub.com
      API_PUBLIC_URL: https://api.nishiohub.com
      CORS_ORIGINS: https://nishiohub.com,https://www.nishiohub.com
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-nishiohub.com}
      MAIL_FROM: ${MAIL_FROM:-support@nishiohub.com}
    volumes:
      - api_storage:/app/storage
      - api_uploads:/app/public/uploads
      - profile_uploads:/app/public/media/profiles
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '5', http://127.0.0.1:3000/up]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 12
    expose: ['3000']
  ui:
    image: nishiohub-ui:${RELEASE_SHA:-local}
    build:
      context: ./nishioHub-ui
      args:
        VITE_API_BASE_URL: https://api.nishiohub.com/api/v1
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
    expose: ['80']
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CERTBOT_DIR:-/var/www/nishioHub/certbot}/www:/var/www/certbot:ro
      - ${CERTBOT_DIR:-/var/www/nishioHub/certbot}/conf:/etc/letsencrypt:ro
    depends_on:
      api: {condition: service_healthy}
      ui: {condition: service_healthy}
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 15s
      timeout: 5s
      retries: 4
  certbot:
    image: certbot/certbot:latest
    profiles: [maintenance]
    entrypoint: /bin/sh
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL}
    volumes:
      - ${CERTBOT_DIR:-/var/www/nishioHub/certbot}/www:/var/www/certbot
      - ${CERTBOT_DIR:-/var/www/nishioHub/certbot}/conf:/etc/letsencrypt
volumes:
  postgres_data:
  api_storage:
  api_uploads:
  profile_uploads:
