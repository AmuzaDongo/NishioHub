name: nishiohub

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: nishiohub_production
      POSTGRES_USER: nishiohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U nishiohub -d nishiohub_production
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - nishiohub_network

  # Ruby on Rails API
  api:
    build:
      context: ./nishioHub-api
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"

      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?Set RAILS_MASTER_KEY}

      DATABASE_URL: postgresql://nishiohub:${POSTGRES_PASSWORD}@db:5432/nishiohub_production

      FRONTEND_URL: https://nishiohub.com

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "3000"

    command:
      - bin/rails
      - server
      - -b
      - 0.0.0.0
      - -p
      - "3000"

    networks:
      - nishiohub_network

  # React + Vite Frontend
  ui:
    build:
      context: ./nishioHub-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.nishiohub.com

    restart: unless-stopped

    expose:
      - "80"

    networks:
      - nishiohub_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - api
      - ui

    networks:
      - nishiohub_network

volumes:
  postgres_data:

networks:
  nishiohub_network:
    driver: bridge