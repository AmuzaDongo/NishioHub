worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_max_body_size 25m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    upstream rails_api { server api:3000; }
    upstream react_ui { server ui:80; }
    server {
        listen 80;
        server_name nishiohub.com www.nishiohub.com api.nishiohub.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name nishiohub.com www.nishiohub.com;
        ssl_certificate /etc/letsencrypt/live/nishiohub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nishiohub.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { proxy_pass http://react_ui; }
    }
    server {
        listen 443 ssl;
        server_name api.nishiohub.com;
        ssl_certificate /etc/letsencrypt/live/nishiohub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nishiohub.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { proxy_pass http://rails_api; proxy_http_version 1.1; }
    }
}
